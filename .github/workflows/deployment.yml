name: Deployment Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Ensure only one deployment runs at a time
concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18
        cache: 'npm'
        cache-dependency-path: ./backend/package-lock.json

    - name: Verify Node.js version
      run: |
        echo "### Environment Information 🔧" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Node version**: $(node --version)" >> $GITHUB_STEP_SUMMARY
        echo "- **NPM version**: $(npm --version)" >> $GITHUB_STEP_SUMMARY
        echo "- **Runner OS**: ${{ runner.os }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Node version: $(node --version)"
        echo "NPM version: $(npm --version)"

    - name: Validate package files
      working-directory: ./backend
      run: |
        echo "Checking package.json and package-lock.json compatibility..."
        if [ ! -f package.json ]; then
          echo "❌ Error: package.json not found" >> $GITHUB_STEP_SUMMARY
          echo "Error: package.json not found"
          exit 1
        fi
        if [ ! -f package-lock.json ]; then
          echo "❌ Error: package-lock.json not found" >> $GITHUB_STEP_SUMMARY
          echo "Error: package-lock.json not found"
          exit 1
        fi
        echo "✅ Package files validated successfully" >> $GITHUB_STEP_SUMMARY
        echo "Package files validated successfully"

    - name: Run npm audit
      working-directory: ./backend
      run: |
        echo "### Security Audit 🔒" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if npm audit --audit-level=moderate; then
          echo "✅ No security vulnerabilities detected" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ Security vulnerabilities detected (non-blocking)" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ Security vulnerabilities detected (non-blocking)"
        fi
      continue-on-error: true

    - name: Install dependencies
      working-directory: ./backend
      run: |
        echo "Installing dependencies..."
        npm ci
        echo "✅ Dependencies installed successfully" >> $GITHUB_STEP_SUMMARY

    - name: Save npm debug log on failure
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: npm-debug-logs-${{ github.run_number }}
        path: |
          ~/.npm/_logs/*.log
          **/npm-debug.log*
        if-no-files-found: warn

    - name: Build application
      working-directory: ./backend
      timeout-minutes: 10
      run: |
        echo "### Build Status 🏗️" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if npm run build --if-present; then
          echo "✅ Build completed successfully" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Build failed" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: build-artifacts-${{ github.run_number }}
        path: |
          backend/dist/
          backend/build/
        if-no-files-found: ignore

    - name: Deploy application
      working-directory: ./backend
      timeout-minutes: 10
      run: |
        echo "### Deployment Status 🚀" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if npm run deploy --if-present; then
          echo "✅ Deployment completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed at**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Deployment failed" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

    - name: Deployment Summary
      if: always()
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Workflow Run**: #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "**Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY