name: Deployment Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Verify Node.js version
      run: |
        echo "Node version: $(node --version)"
        echo "NPM version: $(npm --version)"

    - name: Validate package files
      working-directory: ./backend
      run: |
        echo "Checking package.json and package-lock.json compatibility..."
        if [ ! -f package.json ]; then
          echo "Error: package.json not found"
          exit 1
        fi
        if [ ! -f package-lock.json ]; then
          echo "Error: package-lock.json not found"
          exit 1
        fi
        echo "Package files validated successfully"

    - name: Run npm audit
      working-directory: ./backend
      run: npm audit --audit-level=moderate || true
      continue-on-error: true

    - name: Install dependencies
      working-directory: ./backend
      run: npm ci

    - name: Save npm debug log on failure
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: npm-debug-logs
        path: ~/.npm/_logs/*.log
        if-no-files-found: warn

    - name: Build application
      working-directory: ./backend
      run: npm run build || echo "No build script defined, skipping..."

    - name: Deploy application
      working-directory: ./backend
      run: npm run deploy || echo "No deploy script defined, skipping..."