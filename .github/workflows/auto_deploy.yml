name: Auto Deploy to Server

# This workflow is designed for deployment to a self-hosted server
# It uses the deploy.sh script to manage the deployment process
# For GitHub Actions deployment, see deployment.yml

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'deploy.sh'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    runs-on: self-hosted  # This requires a self-hosted runner
    
    permissions:
      contents: read  # Only need read access to checkout code
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18
        
    - name: Verify Node.js version
      run: |
        echo "Node version: $(node --version)"
        echo "NPM version: $(npm --version)"
        
    - name: Check PM2 installation
      run: |
        if ! command -v pm2 &> /dev/null; then
          echo "PM2 not found, installing..."
          npm install -g pm2
        else
          echo "PM2 version: $(pm2 --version)"
        fi
        
    - name: Run deployment script
      run: |
        chmod +x ./deploy.sh
        ./deploy.sh
      env:
        PROJECT_DIR: ${{ github.workspace }}
        APP_NAME: automation-bot
        ENTRY_POINT: src/index.js
        
    - name: Verify deployment
      run: |
        pm2 list
        pm2 info automation-bot
        
    - name: Health check
      run: |
        # Wait for application to start
        sleep 5
        # Check if process is running
        if pm2 list | grep -q "automation-bot.*online"; then
          echo "✅ Application is running"
        else
          echo "❌ Application is not running"
          exit 1
        fi
